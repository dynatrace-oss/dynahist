plugins {
    id 'java'
    id 'java-library'
    id 'jacoco'
    id 'me.champeau.jmh' version '0.7.3'
    id 'org.sonarqube' version '7.2.2.6593'
    id 'com.diffplug.spotless' version '8.2.1'
    id 'maven-publish'
    id 'signing'
    id 'net.ltgt.errorprone' version '5.0.0'
    id 'me.champeau.gradle.japicmp' version '0.4.6'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

ext {
    latestReleasedVersion = {
        def tempConfig = configurations.create("tempConfig_b1f455c5bc7e3d85")
        dependencies.add(tempConfig.getName(), "com.dynatrace.dynahist:dynahist:+")
        def moduleVersion = tempConfig.resolvedConfiguration.firstLevelModuleDependencies[0].moduleVersion
        configurations.remove(tempConfig)
        return moduleVersion
    }.call()
    archivesBaseName = "dynahist"
}

def readJavaLicense = licenseName -> {
    File licenseFile = new File('licenses/' + licenseName + '.txt')
    def line
    def s = '/*\n'
    licenseFile.withReader { reader ->
        while ((line = reader.readLine()) != null) {
            s += ' *'
            if(!line.isEmpty()) {
                s += ' '
                s += line
            }
            s += '\n'
        }
    }
    s += ' */'
    return s
}

def readPythonLicense = licenseName -> {
    File licenseFile = new File('licenses/' + licenseName + '.txt')
    def line
    def s = '#\n'
    licenseFile.withReader { reader ->
        while ((line = reader.readLine()) != null) {
            s += '#'
            if(!line.isEmpty()) {
                s += ' '
                s += line
            }
            s += '\n'
        }
    }
    s += '#'
    return s
}


java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(11))
    }
    withJavadocJar()
    withSourcesJar()
}

group = 'com.dynatrace.dynahist'
version = '1.4'

spotless {
    ratchetFrom 'origin/main'
    python {
        target 'python/**/*.py'
        black('23.3.0')
        licenseHeader readPythonLicense('APACHE_2_0_DYNATRACE'), '(import|from)'
    }
    java {
        importOrder()
        removeUnusedImports()
        googleJavaFormat('1.34.1')
        licenseHeader readJavaLicense('APACHE_2_0_DYNATRACE')
        targetExclude 'src/main/java/com/dynatrace/hash4j/hashing/Komihash4_3.java','src/main/java/com/dynatrace/hash4j/random/SplitMix64V1.java','src/main/java/com/dynatrace/hash4j/random/RandomExponentialUtil.java'
    }
}

sonarqube {
    properties {
        property 'sonar.projectKey', 'dynatrace-oss_dynahist'
        property 'sonar.organization', 'dynatrace-oss'
    }
}

dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.14.2") // upgrade to version 6 requires Java 17
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.14.2") // upgrade to version 6 requires Java 17
    testImplementation("org.junit.jupiter:junit-jupiter-params:5.14.2") // upgrade to version 6 requires Java 17
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.14.2") // upgrade to version 6 requires Java 17
    testImplementation("org.assertj:assertj-core:3.27.7")
    errorprone("com.google.errorprone:error_prone_core:2.47.0")
    jmh group: 'org.hdrhistogram', name: 'HdrHistogram', version: '2.2.2'
    jmh group: 'com.datadoghq', name: 'sketches-java', version: '0.8.3'
    jmh group: 'org.openjdk.jol', name: 'jol-core', version: '0.17'
    jmh group: 'com.newrelic', name: 'nrsketch', version: '1.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    jmh
    main
    test
}

tasks.register("jApiCmp", me.champeau.gradle.japicmp.JapicmpTask) {
    dependsOn "jar"

    def baselineVersion = project.hasProperty("apiCheckBaseVersion")?apiCheckBaseVersion:latestReleasedVersion
    def baselineArtifact = findArtifact(baselineVersion)
    oldClasspath = files(baselineArtifact)

    def newVersion = project.hasProperty("apiCheckNewVersion")?apiCheckNewVersion:version
    def newArtifact = project.hasProperty("apiCheckNewVersion")?findArtifact(newVersion):file(tasks.named("jar").get().archiveFile.get().asFile)
    newClasspath = files(newArtifact)

    onlyModified = true
    packageExcludes.addAll("*.internal", "*.internal.*")


    txtOutputFile = file("$rootDir/doc/apidiffs/v${baselineVersion}___v${newVersion}.txt")
}


File findArtifact(String version) {
    def existingGroup = project.group
    try {
        project.group = "tempGroup_f9af2a601d1b23d0"
        def depModule = "$existingGroup:$archivesBaseName:$version@jar"
        def depJar = "${archivesBaseName}-${version}.jar"
        def configuration = project.configurations.detachedConfiguration(
                project.dependencies.create(depModule)
        )
        return project.files(configuration.files).filter { it.name == depJar }.singleFile
    } finally {
        project.group = existingGroup
    }
}

tasks.compileJava.options.release.set(8)
tasks.compileTestJava.options.release.set(8)


jacocoTestReport {
    reports {
        xml.required = true
        csv.required = true
    }
}

test {
    useJUnitPlatform()
}

jmh {
    fork = 1
    timeUnit = 'us'
    failOnError = false
    timeOnIteration = '1s'
    warmupForks = 1
    warmupIterations = 3
    warmupBatchSize = 1
    warmup = '1s'
    iterations = 10
    resultFormat = 'JSON'
}

task evaluateBenchmarks(type:Exec) {
    group "evaluation"
    workingDir '.'
    commandLine 'python', 'python/benchmark_evaluation.py'
}

tasks.register('checkStatusForBenchmarks') {
    outputs.upToDateWhen { false }
    doLast {
        def status_text = "git status --porcelain".execute().text
        if(status_text?.trim()) {
            throw new GradleException('There are uncommitted changes:\n' + status_text)
        }
    }
}

tasks.register('copyBenchmarkReport', Copy) {
    def proc = "git rev-parse HEAD".execute()
    def revision = proc.text.trim()
    from('build/results/jmh/') {
        include 'results.*'
        rename 'results', new Date().format('yyyy-MM-dd-HH-mm-ss') + ' ' + revision
    }
    into 'benchmark-results'
}

tasks.register('deleteBenchmarkReport', Delete) {
    delete 'build/results/jmh/results.json'
}

tasks.test.finalizedBy jacocoTestReport
tasks.jmh.finalizedBy copyBenchmarkReport
tasks.copyBenchmarkReport.finalizedBy deleteBenchmarkReport
tasks.deleteBenchmarkReport.finalizedBy evaluateBenchmarks
check.dependsOn jacocoTestCoverageVerification
tasks.jmh.dependsOn checkStatusForBenchmarks
tasks.copyBenchmarkReport.dependsOn checkStatusForBenchmarks

sourceSets {
    jmh
    main
    test
}


javadoc {
    failOnError = true
    title = archivesBaseName + " " + project.version + " API"
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
}

tasks.withType(JacocoReport).configureEach {
    reports {
        xml.required = true // needed for sonarqube
        csv.required = true // needed for sonarqube
    }
}

tasks.withType(JacocoCoverageVerification).configureEach {
    violationRules {
        rule {
            limit {
                minimum = 1.0
                counter = 'LINE'
            }
            limit {
                minimum = 1.0
                counter = 'BRANCH'
            }
        }
    }
}

task spaceConsumptionBenchmark(type: JavaExec) {
    group = "Benchmark"
    description = "Runs the space consumption benchmark"
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = "com.dynatrace.dynahist.SpaceConsumptionBenchmark"
}

task recordingSpeedBenchmark {
    group = "Benchmark"
    description = "Runs the recording speed benchmark"
    dependsOn "jmh"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'com.dynatrace.dynahist:dynahist'
                description = 'DynaHist: A Dynamic Histogram Library for Java'
                url = 'https://github.com/dynatrace-oss/dynahist'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'Dynatrace'
                        name = 'Dynatrace LLC'
                        email = 'opensource@dynatrace.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/dynatrace-oss/dynahist.git'
                    developerConnection = 'scm:git:ssh://github.com/dynatrace-oss/dynahist.git'
                    url = 'https://github.com/dynatrace-oss/dynahist'
                }
            }
        }
    }
    repositories {
        maven {
            url = "$projectDir/build/mavencentral/repo"
        }
    }
}

signing {
    useInMemoryPgpKeys(System.getenv("GPG_PRIVATE_KEY"), System.getenv("GPG_PASSPHRASE"))
    sign publishing.publications.mavenJava
}

tasks.register("createRepoForUploadToMavenCentral", Zip) {
    dependsOn build, publish
    from "$projectDir/build/mavencentral/repo"
    destinationDirectory = file("$projectDir/build/mavencentral")
    archiveFileName = "repo.zip"
}
